name: Check for atvloadly updates

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub and bump the pinned version if a newer release exists
        id: bump
        run: python3 .github/scripts/bump_atvloadly.py

      - name: Commit and push the bump
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saransh-atvloadly/docker-compose.yml saransh-atvloadly/umbrel-app.yml
          git commit -m "atvloadly: automated bump to ${{ steps.bump.outputs.version }}"
          git push
