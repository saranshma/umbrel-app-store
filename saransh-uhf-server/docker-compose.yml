version: "3.7"

services:

  # No app_proxy here on purpose. app_proxy puts every request through umbrelOS's
  # own login gate (redirects to /app-auth), which is right for a browser dashboard
  # but breaks a raw API backend: the UHF app on Apple TV/iOS talks to this server
  # directly and chokes on the HTML login redirect it gets back instead of JSON.
  # network_mode: host (same pattern as the Home Assistant app, which has the same
  # "native app needs direct API access" requirement) binds straight to the host,
  # bypassing that gate, and also fixes UHF's mDNS/Bonjour broadcast: on the default
  # per-app bridge network it was advertising the container's internal Docker IP,
  # which isn't reachable from other devices on the real LAN.
  server:
    image: swapplications/uhf-server:2.0.0@sha256:dcb832f910be8d85b67a25adb7cf12defb9e8e5ea1117e2c1a03fd5db4a82027
    init: true
    restart: on-failure
    stop_grace_period: 1m
    network_mode: host
    # The image ships no ENTRYPOINT and CMD ["bash"], so the binary is invoked here.
    # Append --enable-commercial-detection to scan recordings for ad breaks (CPU heavy,
    # runs for several minutes after each recording finishes).
    command: uhf-server --port 8000 --recordings-dir /recordings
    volumes:
      # SQLite/state on the internal NVMe (ext4) — exFAT is not safe for a database.
      - ${APP_DATA_DIR}/data/db:/var/lib/uhf-server
      # Recordings on the 932G USB drive. create_host_path: false makes the container
      # fail to start if the drive is unmounted, instead of silently filling the NVMe.
      - type: bind
        source: /home/umbrel/umbrel/external/saransh/uhf-recordings
        target: /recordings
        read_only: false
        bind:
          create_host_path: false
