version: "3.7"

services:
  # No app_proxy: atvloadly needs host networking so it can see the Apple TV via
  # mDNS/Bonjour (_remotepairing-manual-pairing._tcp), and it talks to the host's
  # avahi-daemon + dbus sockets (both present and running on umbrelOS).
  # Web UI is served directly on port 5533.
  server:
    image: bitxeno/atvloadly:v0.8.2@sha256:8e14413e489b4b2d9affa860582222a85731c912a4f20d455f617da7d4eca8fa
    init: true
    restart: unless-stopped
    network_mode: host
    # Upstream recommends seccomp:unconfined; switch to `privileged: true` instead
    # if the Apple TV is not discovered.
    security_opt:
      - seccomp:unconfined
    environment:
      SERVICE_PORT: "5533"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
