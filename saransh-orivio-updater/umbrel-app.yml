manifestVersion: 1
id: saransh-orivio-updater
category: automation
name: Apple TV App Updater
version: "1.1.1"
tagline: Auto-install new GitHub releases of an Apple TV app via atvloadly
port: 5534
description: >-
  Background worker with no web UI. Every 6 hours it checks the GitHub releases of the
  configured Apple TV app (Nuvio TV by default; set RELEASE_REPO, TAG_PREFIX and
  ASSET_SUFFIX in the compose file to track another). When a new release appears it
  downloads the IPA, strips the Top Shelf extension and the shared app-group entitlement
  (Apple refuses to register that group on a different team), and asks atvloadly to
  install it on the Apple TV. Requires the atvloadly app to be installed, paired and
  signed in. Logs show each check.
releaseNotes: >-
  1.1.1: script is embedded in the compose file so app updates actually deploy it; fixes install-status polling.
  1.1.0: now tracks Nuvio TV (bobsupra/NuvioTVOS) instead of Orivio TV.

  1.0.0: initial release.
developer: Saransh Mathur
website: https://github.com/bobsupra/NuvioTVOS
repo: https://github.com/saranshma/umbrel-app-store
support: https://github.com/saranshma/umbrel-app-store/issues
submitter: Saransh Mathur
submission: https://github.com/saranshma/umbrel-app-store
icon: https://raw.githubusercontent.com/saranshma/umbrel-app-store/main/saransh-orivio-updater/icon.svg
gallery: []
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
